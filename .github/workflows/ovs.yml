name: 海外龍頭日K
# 掃描頁「🌏 海外龍頭」小卡（data/ovs.json）：themes.json 各主題 us／jp／kr 欄位的美股、日股、韓股日 K，來源 Yahoo。
on:
  schedule:
    - cron: "50 6 * * 1-5"    # 台北 14:50（東京、首爾都在台北 14:30 收盤）
    - cron: "40 9 * * 1-5"    # 台北 17:40（排程延遲或 Yahoo 還沒結算時補一次）
    - cron: "30 21 * * 1-5"   # 台北 05:30（週二～六；美股收盤後，夏令 04:00、冬令 05:00 收盤）
    - cron: "0 0 * * 2-6"     # 台北 08:00（補一次，9 點開盤前看得到昨晚美股）
  workflow_run:               # 2026-11-18：GitHub 排程實測延遲 7～10 小時（05:30、08:00 那兩次到 10 點都還沒跑）→ 跟在「更新股票資料」後面跑
    workflows: ["更新股票資料"]   #   （cron-job.org 16:40／21:40 準時觸發；它半夜被延遲的排程也會帶著跑，清晨通常有 1～2 次）
    types: [completed]
  push:
    branches: [main]
    paths: ["fetch_ovs.py", ".github/workflows/ovs.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ovs
  cancel-in-progress: false
jobs:
  ovs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓美股／日股／韓股日K
        run: python fetch_ovs.py
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ovs.json
          git diff --cached --quiet && exit 0
          git commit -m "ovs: $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
