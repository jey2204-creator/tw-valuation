name: 做空資訊
# 掃描頁「空」模式小卡／放大卡的融券餘額、平盤下可否放空、停券預告（data/short.json）。見 fetch_short.py。
on:
  schedule:
    - cron: "40 13 * * 1-5"   # 台北 21:40（融資融券約 20:30～21:30 公布）
    - cron: "30 23 * * 0-4"   # 台北 07:30（補一次；平盤下名單是當日適用）
  workflow_run:               # 跟在「更新股票資料」後面跑（cron-job.org 16:40／21:40 準時觸發）
    workflows: ["更新股票資料"]
    types: [completed]
  push:
    branches: [main]
    paths: ["fetch_short.py", ".github/workflows/short.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: short
  cancel-in-progress: false
jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓融券／平盤下可空名單／停券預告
        run: python fetch_short.py
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/short.json data/short_diag.json 2>/dev/null || git add data/short_diag.json
          git diff --cached --quiet && exit 0
          git commit -m "short: $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
