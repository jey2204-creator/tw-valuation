name: itrust 連通性探測（主排程端點）
run-name: itrust probe ${{ inputs.date }}
on:
  workflow_dispatch:
    inputs:
      date:
        description: "交易日 YYYYMMDD"
        required: true
permissions:
  contents: write
concurrency:
  group: itrust-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 探測各端點（只讀）
        run: |
          mkdir -p itrust/probe
          python itrust/probe_endpoints.py "${{ inputs.date }}" > "itrust/probe/${{ inputs.date }}.md"
          cat "itrust/probe/${{ inputs.date }}.md"
      - name: 只提交 itrust/probe/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A itrust/probe/
          git diff --cached --quiet && exit 0
          git commit -m "itrust probe: ${{ inputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
