name: itrust 每日法人原始資料（主排程 方案B）
run-name: itrust daily ${{ inputs.date }}
on:
  workflow_dispatch:           # 由 claude.ai 雲端排程觸發，帶入交易日
    inputs:
      date:
        description: "交易日 YYYYMMDD"
        required: true
permissions:
  contents: write
concurrency:
  group: itrust-daily
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓證交所／櫃買／觀測站原始資料
        run: python itrust/daily_fetch.py "${{ inputs.date }}"
      - name: 只提交 itrust/daily/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A itrust/daily/
          git diff --cached --quiet && exit 0
          git commit -m "itrust daily: ${{ inputs.date }}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
