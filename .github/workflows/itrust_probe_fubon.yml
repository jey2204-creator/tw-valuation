name: itrust 連通性探測（MoneyDJ 投信估計持股）
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: itrust-probe-fubon
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 探測（只讀）
        run: |
          mkdir -p itrust/probe
          F="itrust/probe/fubon_$(TZ=Asia/Taipei date +%Y%m%d_%H%M).md"
          python itrust/probe_fubon.py > "$F"
          cat "$F" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: 只提交 itrust/probe/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A itrust/probe/
          git diff --cached --quiet && exit 0
          git commit -m "itrust probe: moneydj 投信持股"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
