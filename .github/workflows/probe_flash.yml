name: 探測重訊來源（一次性）
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python probe_flash.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flash_probe.json
          git commit -m "probe flash" || exit 0
          for i in 1 2 3; do git pull --rebase origin main && git push && exit 0; sleep 8; done
