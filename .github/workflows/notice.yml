name: 注意處置股
on:
  schedule:
    - cron: "25 9 * * 1-5"    # 台北 17:25（證交所／櫃買通常 17:00 前後公布）
    - cron: "25 10 * * 1-5"   # 台北 18:25 備援
    - cron: "25 12 * * 1-5"   # 台北 20:25 備援
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: notice
  cancel-in-progress: false
jobs:
  notice:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓注意／處置／快達處置名單
        run: python fetch_notice.py
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notice.json data/notice
          git diff --cached --quiet && exit 0
          git commit -m "notice: $(TZ=Asia/Taipei date '+%F %H:%M')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 10
          done
          exit 1
