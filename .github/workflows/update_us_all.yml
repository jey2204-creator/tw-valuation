name: 更新美股全市場財報
on:
  schedule:
    - cron: "0 12 * * 0"   # 每週日 台北時間 20:00（SEC 財報一季才變，每週一次即可）
  workflow_dispatch:
    inputs:
      tickers:
        description: "指定代號（空白分隔，留空 = 依 UNIVERSE_N 清單）"
        required: false
        default: ""
      universe_n:
        description: "依市值取前 N 檔（0 = 全市場，需搭配 mode=zip）"
        required: false
        default: "0"
      mode:
        description: "api（逐檔）或 zip（下載 companyfacts.zip，全市場用）"
        required: false
        default: "zip"
permissions:
  contents: write
concurrency:
  group: push-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓 SEC 財報（全市場）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SEC_UA: ${{ secrets.SEC_UA }}
          UNIVERSE_N: ${{ github.event.inputs.universe_n || '0' }}
          SEC_MODE: ${{ github.event.inputs.mode || 'zip' }}
        run: python us/fetch_us_all.py ${{ github.event.inputs.tickers }}
      - name: 有變動才提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us/data/all/
          git diff --cached --quiet && exit 0
          git commit -m "us all data: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push
