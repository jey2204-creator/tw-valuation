name: 回測資料（台股主題成份股月底還原價）
on:
  workflow_dispatch:
    inputs:
      force:
        description: "1＝全部重抓"
        required: false
        default: "0"
permissions:
  contents: write
concurrency:
  group: push-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓 FinMind 台股月底還原價
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python tools/bt_fetch_tw.py $([ "${{ github.event.inputs.force }}" = "1" ] && echo --force)
      - name: 提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/bt_data/
          git diff --cached --quiet && exit 0
          git commit -m "backtest data: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push
