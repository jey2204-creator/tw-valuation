name: 更新韓股市值排行
on:
  schedule:
    - cron: "40 9 * * 1-5"   # 台北時間 週一～五 17:40（韓股 14:30 收盤後）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - kr/fetch_rank.py
      - .github/workflows/update_kr_rank.yml
permissions:
  contents: write
concurrency:
  group: push-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓市值排行（Naver）
        run: python kr/fetch_rank.py 20
      - name: 有變動才提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr/data/rank.json kr/data/rank_diag.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "kr rank: $(TZ=Asia/Taipei date '+%F %H:%M')"
          git pull --rebase origin main
          git push
