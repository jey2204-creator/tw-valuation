name: 更新韓股資料
on:
  schedule:
    - cron: "30 9 * * 1-5"   # 台北時間 週一～五 17:30（韓股 14:30 收盤後）
  workflow_dispatch:
    inputs:
      codes:
        description: "指定代號（空白分隔，留空 = 全部）"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: push-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓韓股資料（OpenDART 財報 + Naver 股價）
        env:
          DART_KEY: ${{ secrets.DART_KEY }}
          KR_DEBUG: "1"
        run: python kr/fetch_kr.py ${{ github.event.inputs.codes }}
      - name: 有變動才提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kr/data/
          git diff --cached --quiet && exit 0
          git commit -m "kr data: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push
