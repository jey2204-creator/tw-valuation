name: itrust 即時看線歷史日K（日K workflow 跑完後接續合併）
on:
  workflow_run:                 # itrust 日K（每晚由 claude.ai 雲端排程觸發）成功跑完後自動接著跑
    workflows: ["itrust 日K（近 20 個交易日的投信＋外資＋土洋前20名聯集）"]
    types: [completed]
  workflow_dispatch:
  push:                         # 合併腳本或本檔有改動時跑一次，順便驗證
    branches: [main]
    paths:
      - itrust/live/merge_hist.py
      - .github/workflows/itrust_live_hist.yml
permissions:
  contents: write
concurrency:
  group: itrust-live-hist
  cancel-in-progress: false
jobs:
  merge:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 合併新日K到 itrust/live/hist.json
        run: python itrust/live/merge_hist.py
      - name: 只提交 itrust/live/hist.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add itrust/live/hist.json
          git diff --cached --quiet && exit 0
          D=$(python -c "import json;print(json.load(open('itrust/live/hist.json'))['asOf'])")
          git commit -m "itrust live hist: ${D}"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
