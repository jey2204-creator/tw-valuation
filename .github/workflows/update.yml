name: 更新股票資料
on:
  schedule:
    - cron: "40 10 * * 1-5"   # 台北時間 平日 18:40（收盤後，FinMind 已更新）
  workflow_dispatch:           # 可在 Actions 頁面手動執行
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fetch.py
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Taipei date +%F)"
          git push
