name: 更新股票資料
on:
  schedule:
    # GitHub 免費排程常延遲 4～6 小時（2026/10 實測 18:40 的排程 23:30～01:00 才跑）
    # → 改在非整點、非半點的 :47 多排幾次，提高早點跑到的機率；之後再加 cron-job.org 準時觸發
    - cron: "47 7 * * 1-5"    # 台北 15:47（收盤價已出）
    - cron: "47 8 * * 1-5"    # 台北 16:47（三大法人已出）
    - cron: "47 9 * * 1-5"    # 台北 17:47（備援）
    - cron: "40 10 * * 1-5"   # 台北 18:40（原本的第一次，留著當備援）
    - cron: "47 13 * * 1-5"   # 台北 21:47（融資券約 21:00 公布）
    - cron: "30 14 * * 1-5"   # 台北 22:30（補抓 FinMind 晚間才進來的資料）
  workflow_dispatch:           # 可在 Actions 頁面手動執行
    inputs:
      force_headcount:
        description: "填 1 強制重抓 MOPS 員工人數"
        required: false
        default: ""
permissions:
  contents: write
concurrency:                   # 排程延遲時可能好幾次擠在一起 → 排隊一次跑一個，避免 git push 互撞
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 全市場摘要（主題頁用）
        continue-on-error: true
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fetch_summary.py
      - name: 員工薪資中位數（每年 6 月底換新年度，內容沒變不寫檔）
        continue-on-error: true
        timeout-minutes: 5
        run: python fetch_salary.py
      - name: 員工人數（MOPS 一年一次；手動執行可填 force_headcount=1 強制）
        continue-on-error: true
        timeout-minutes: 6
        env:
          FORCE: ${{ github.event.inputs.force_headcount || '' }}
        run: python fetch_headcount.py
      - name: 股價動能＋法人（動能模式用）
        continue-on-error: true
        timeout-minutes: 20
        run: python fetch_momentum.py
      - name: 逐日籌碼＋K 線分片（法人、融資券、開高低、年線）
        continue-on-error: true
        timeout-minutes: 15
        run: python fetch_chip.py
      - name: 集保大戶持股比（每週）
        continue-on-error: true
        timeout-minutes: 12
        run: python fetch_tdcc.py
      - name: 抓資料
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python fetch.py
      - name: 有變動才提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase -X theirs || (git rebase --abort; git pull --no-rebase -X ours)
          git push
