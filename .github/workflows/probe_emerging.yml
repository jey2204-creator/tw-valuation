name: 興櫃資料探測
on:
  workflow_dispatch:
  push:
    paths: ["probe/probe_emerging.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - env: {FINMIND_TOKEN: "${{ secrets.FINMIND_TOKEN }}"}
        run: python probe/probe_emerging.py 3595
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add probe/3595.json; git commit -m "probe 3595" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
