name: 更新美股資料
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 台北時間 週二～六 06:30（美股收盤後）
  workflow_dispatch:
    inputs:
      tickers:
        description: "指定代號（空白分隔，留空 = 全部 45 檔）"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: push-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 抓美股資料（SEC 財報 + FinMind 股價）
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python us/fetch_us.py ${{ github.event.inputs.tickers }}
      - name: 有變動才提交
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add us/data/
          git diff --cached --quiet && exit 0
          git commit -m "us data: $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main
          git push
