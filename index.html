<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>台股估值看板</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="估值看板">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: phone-first single column, sticky quote header + section chips, one card per chart */
:root{
  --bg:#f3f4f6; --card:#ffffff; --fg:#151a23; --muted:#5d6675; --line:#e2e5ea; --grid:#eceef2;
  --accent:#1f5fbf; --accent2:#0e8f86; --warm:#c46a12;
  --up:#d32f2f; --down:#138a4b;
  --b1:#dbe9f7; --b2:#c3dcf0; --b3:#e6ecd2; --b4:#f6e1bd; --b5:#f3c7b3;
  --price:#151a23; --est:#9db8e3;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --card:#171b23; --fg:#e8ebf0; --muted:#97a0ae; --line:#272d38; --grid:#232833;
  --accent:#6aa1ff; --accent2:#3cc7b9; --warm:#f0a04b; --up:#ff5b5b; --down:#35c27a;
  --b1:#1b2b40; --b2:#20374f; --b3:#2d3a28; --b4:#463821; --b5:#4d2b24;
  --price:#f4f6fa; --est:#3b5687; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --card:#171b23; --fg:#e8ebf0; --muted:#97a0ae; --line:#272d38; --grid:#232833;
  --accent:#6aa1ff; --accent2:#3cc7b9; --warm:#f0a04b; --up:#ff5b5b; --down:#35c27a;
  --b1:#1b2b40; --b2:#20374f; --b3:#2d3a28; --b4:#463821; --b5:#4d2b24;
  --price:#f4f6fa; --est:#3b5687; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.quote{padding-block:14px 0}
.qrow{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.code{font-family:var(--f-num);font-weight:600;font-size:13px;color:var(--muted);letter-spacing:.06em}
.name{font-weight:900;font-size:22px}
.px{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:24px;color:var(--up)}
.chg{font-family:var(--f-num);font-size:13px;color:var(--up)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:15px;font-weight:600}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.04em}
nav.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);margin-top:10px}
nav.chips::-webkit-scrollbar{display:none}
nav.chips a{flex:none;font-size:13px;color:var(--fg);text-decoration:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 11px}
nav.chips a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
section.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px;margin-top:14px;scroll-margin-top:64px}
.card h2{font-size:17px;font-weight:700;margin:0;text-wrap:balance;display:flex;align-items:center;gap:8px}
.card h2 small{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.05em}
.take{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.take strong{color:var(--fg);font-weight:700}
.chart{width:100%;height:260px;margin-top:6px}
.chart.tall{height:300px}
.foot{font-size:11.5px;color:var(--muted);margin:2px 0 6px}
.pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--b4);color:var(--fg)}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.inputs label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.inputs input{font-family:var(--f-num);font-size:16px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:100%}
.tbl{overflow-x:auto;margin-top:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:12px}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
tr.e td{color:var(--accent)}
.search{position:relative;margin-top:10px}
.search input{width:100%;font:inherit;font-size:16px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:20;max-height:60vh;overflow-y:auto}
.results button{display:flex;width:100%;align-items:baseline;gap:10px;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--bg)}
.results .rid{font-family:var(--f-num);font-weight:600;min-width:3.2em}
.results .rmeta{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.results .rhead{font-size:11px;color:var(--muted);padding:8px 12px 4px;letter-spacing:.05em}
.meta{font-size:12px;color:var(--muted)}
.live{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.dim .chart{opacity:.35;transition:opacity .2s}
.err{color:var(--up);font-size:13px}
.note{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.6}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}.name{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>

</head>
<body>
<div class="wrap">
<header class="quote">
  <div class="qrow">
    <span class="code" id="code"></span>
    <span class="name" id="nm">—</span>
    <span class="px" id="px">—</span>
  </div>
  <div class="meta" id="meta"></div>
  <div class="qrow" style="justify-content:space-between">
    <span class="foot" id="asof">載入中…</span><span class="chg" id="chg"></span>
  </div>
  <div class="stats">
    <div class="stat"><span>本益比</span><b id="sPE">—</b></div>
    <div class="stat"><span>股價淨值比</span><b id="sPB">—</b></div>
    <div class="stat"><span>近四季EPS</span><b id="sEPS">—</b></div>
    <div class="stat"><span>每股淨值</span><b id="sBV">—</b></div>
  </div>
  <div class="search" role="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="輸入代號或名稱，例如 2454、聯發科" aria-label="搜尋股票">
    <div class="results" id="res" hidden></div>
  </div>
</header>
  <nav class="chips" aria-label="圖表">
    <a href="#rev">營收</a><a href="#margin">三率</a><a href="#eps">EPS</a><a href="#fwd">預估EPS</a><a href="#pe">本益比河流</a><a href="#pb">淨值比河流</a>
  </nav>
<p class="err" id="err" hidden></p>

<section class="card" id="rev">
  <h2>月營收 <small>億元｜近 36 個月</small></h2>
  <p class="take" id="tRev"></p>
  <div class="chart" id="cRev"></div>
  <p class="foot">柱：單月營收　線：年增率（右軸 %）</p>
</section>
<section class="card" id="margin">
  <h2>三率 <small>季｜%</small></h2>
  <p class="take" id="tMar"></p>
  <div class="chart" id="cMar"></div>
  <p class="foot">淨利率以歸屬母公司淨利計算</p>
</section>
<section class="card" id="eps">
  <h2>EPS <small>季｜元</small></h2>
  <p class="take" id="tEps"></p>
  <div class="chart" id="cEps"></div>
  <p class="foot">柱：單季 EPS　線：近四季累計（右軸）</p>
</section>
<section class="card" id="fwd">
  <h2>預估 EPS <small>自建模型｜可調假設</small></h2>
  <p class="take" id="tFwd"></p>
  <div class="inputs">
    <label for="iMon"><span id="lMon">未公布月份營收估（億／月）</span><input id="iMon" type="number" inputmode="decimal" step="10"></label>
    <label for="iNm">淨利率假設（%）<input id="iNm" type="number" inputmode="decimal" step="0.5"></label>
    <label for="iQg">之後各季營收季增（%）<input id="iQg" type="number" inputmode="decimal" step="1"></label>
    <label for="iYg"><span id="lYg">明年營收年增（%）</span><input id="iYg" type="number" inputmode="decimal" step="1"></label>
  </div>
  <div class="chart" id="cFwd"></div>
  <div class="tbl"><table id="tbFwd"></table></div>
  <p class="foot" id="fFwd"></p>
</section>
<section class="card" id="pe">
  <h2>本益比河流圖 <small>月</small></h2>
  <p class="take" id="tPE"></p>
  <div class="chart tall" id="cPE"></div>
  <p class="foot" id="fPE"></p>
</section>
<section class="card" id="pb">
  <h2>股價淨值比河流圖 <small>月</small></h2>
  <p class="take" id="tPB"></p>
  <div class="chart tall" id="cPB"></div>
  <p class="foot" id="fPB"></p>
</section>
<p class="note" id="note"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(v,d=0)=>v==null?'—':v.toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d});
const sum=a=>a.reduce((x,y)=>x+y,0);
let D,L,R,Q,V,M,PEM,PBM;const charts={};

// 由歷史倍數自動產生 6 條色帶（取 5%~95% 分位，四捨五入到整齊級距）
function bands(vals){
  const v=vals.filter(x=>x>0).sort((a,b)=>a-b);if(v.length<6)return [1,2,3,4,5,6];
  const nice=x=>x>=10?Math.round(x):Math.round(x*10)/10;
  const out=[];for(const p of [.02,.2,.4,.6,.8,.98]){let x=nice(v[Math.round(p*(v.length-1))]);if(out.length&&x<=out[out.length-1])x=nice(out[out.length-1]*1.05+(x>=10?1:0.1));out.push(x)}
  return out;
}
function qInfo(lbl){return {y:2000+ +lbl.slice(0,2),n:+lbl[3]}}
// 預估模型：最新已公布季 → 下一季用月營收（缺的月份用輸入值），之後各季用季增率，跨年用年增率
function model(){
  const mon=+$('iMon').value||0,nm=(+$('iNm').value||0)/100,qg=(+$('iQg').value||0)/100,yg=(+$('iYg').value||0)/100;
  const lq=qInfo(Q[Q.length-1][0]);let y=lq.y,n=lq.n+1;if(n>4){n=1;y++}
  const ms=[1,2,3].map(i=>`${y}-${String((n-1)*3+i).padStart(2,'0')}`);
  const known=ms.map(k=>(V.find(x=>x[0]===k)||[])[1]);
  const est=[];let r=sum(known.map(x=>x??mon));
  est.push({lbl:`${String(y).slice(2)}Q${n}E`,r,e:r*nm/D.shares});
  for(let k=n+1;k<=4;k++){r*=1+qg;est.push({lbl:`${String(y).slice(2)}Q${k}E`,r,e:r*nm/D.shares})}
  const yy=String(y).slice(2),act=Q.filter(x=>x[0].startsWith(yy));
  const rY=sum(act.map(x=>x[1]))+sum(est.map(x=>x.r)),eY=sum(act.map(x=>x[5]))+sum(est.map(x=>x.e));
  const rN=rY*(1+yg),eN=rN*nm/D.shares;
  return {y,est,known,ms,rY,eY,rN,eN,actY:sum(act.map(x=>x[5]))};
}
function mk(id){if(!charts[id])charts[id]=echarts.init($(id));return charts[id]}
function base(){
  const t={color:css('--muted'),fontFamily:'IBM Plex Mono, ui-monospace, monospace',fontSize:10};
  return {textStyle:{fontFamily:'Noto Sans TC, sans-serif',color:css('--fg')},
    grid:{left:6,right:6,top:28,bottom:6,containLabel:true},
    tooltip:{trigger:'axis',confine:true,backgroundColor:css('--card'),borderColor:css('--line'),textStyle:{color:css('--fg'),fontSize:12},axisPointer:{type:'line',lineStyle:{color:css('--muted')}}},
    legend:{top:0,left:0,itemWidth:12,itemHeight:8,textStyle:{color:css('--muted'),fontSize:11}},
    xAxis:{type:'category',axisLine:{lineStyle:{color:css('--line')}},axisTick:{show:false},axisLabel:t},
    yAxis:{type:'value',scale:true,splitLine:{lineStyle:{color:css('--grid')}},axisLabel:t},animationDuration:500};
}
function header(){
  const lastR=R[R.length-1];
  $('code').textContent=D.id;$('px').textContent=fmt(L.close,L.close<100?2:0);
  const ch=L.close-L.prev,chp=ch/L.prev*100,col=ch>0?'var(--up)':ch<0?'var(--down)':'var(--muted)';
  $('chg').textContent=(ch>0?'▲ ':ch<0?'▼ ':'')+fmt(Math.abs(ch),L.close<100?2:0)+'（'+(ch>=0?'+':'')+chp.toFixed(2)+'%）';
  $('px').style.color=col;$('chg').style.color=col;
  $('asof').textContent='收盤 '+L.date.replaceAll('-','/');
  $('sPE').textContent=L.pe?L.pe.toFixed(2):'—';$('sPB').textContent=L.pb?L.pb.toFixed(2):'—';
  $('sEPS').textContent=lastR[2]!=null?lastR[2].toFixed(2):'—';$('sBV').textContent=lastR[3]!=null?lastR[3].toFixed(1):'—';
  const lv=V[V.length-1],yr=lv[0].slice(0,4),mo=+lv[0].slice(5);
  const ytd=sum(V.filter(x=>x[0].startsWith(yr)).map(x=>x[1])),ytdP=sum(V.filter(x=>x[0].startsWith(String(yr-1))&&+x[0].slice(5)<=mo).map(x=>x[1]));
  $('tRev').innerHTML=`${mo} 月 <strong>${fmt(lv[1])} 億</strong>，年增 <strong>${lv[2]}%</strong>；1–${mo} 月累計年增 <strong>${ytdP?((ytd/ytdP-1)*100).toFixed(1):'—'}%</strong>`;
  const q1=Q[Q.length-1],q0=Q[Q.length-2];
  const pc=v=>v==null?'—':v+'%';$('tMar').innerHTML=`${q1[0]} 毛利率 <strong>${pc(q1[2])}</strong>、營益率 <strong>${pc(q1[3])}</strong>、淨利率 <strong>${pc(q1[4])}</strong>（上季 ${pc(q0[2])}／${pc(q0[3])}／${pc(q0[4])}）`+(q1[2]==null?'<br><span class="pill">金融業</span> 財報沒有毛利與營業利益，只顯示淨利率':'');
  $('tEps').innerHTML=`${q1[0]} EPS <strong>${q1[5]}</strong> 元${q0[5]>0?`，季增 ${((q1[5]/q0[5]-1)*100).toFixed(0)}%`:''}；近四季 <strong>${lastR[2]?.toFixed(2)}</strong> 元`;
  const pct=(arr,v)=>Math.round(arr.filter(x=>x!=null&&x<=v).length/arr.filter(x=>x!=null).length*100);
  const band=(ms,v)=>{for(let i=ms.length-1;i>=0;i--)if(v>=ms[i])return i===ms.length-1?`${ms[i]} 倍以上`:`${ms[i]}–${ms[i+1]} 倍`;return `${ms[0]} 倍以下`};
  const yrs=(R.length/12).toFixed(1);
  $('tPE').innerHTML=L.pe?`目前 <strong>${L.pe} 倍</strong>，位在 <span class="pill">${band(PEM,L.pe)}</span> 帶，高於近 ${yrs} 年 <strong>${pct(R.map(r=>r[4]),L.pe)}%</strong> 的月份`:'近四季虧損，本益比不適用';
  if(D.cyclical)$('tPE').innerHTML+='<br><span class="pill">循環股</span> EPS 高峰時本益比會偏低、谷底時偏高，請以淨值比河流圖為主';
  $('tPB').innerHTML=`目前 <strong>${L.pb} 倍</strong>，位在 <span class="pill">${band(PBM,L.pb)}</span> 帶，高於近 ${yrs} 年 <strong>${pct(R.map(r=>r[5]),L.pb)}%</strong> 的月份`;
  $('fPE').textContent=`色帶 = 近四季 EPS × ${PEM.join('／')} 倍（歷史 2／20／40／60／80／98% 分位數）；粗線為月底收盤價`;
  $('fPB').textContent=`色帶 = 每股淨值 × ${PBM.join('／')} 倍（歷史 2／20／40／60／80／98% 分位數）`;
  $('note').textContent=`資料來源：FinMind（證交所月營收、財報、本益比／淨值比），更新時間 ${D.updated.replace('T',' ').replace('Z',' UTC')}。每個交易日傍晚自動更新。本頁不構成投資建議。`;
}
function render(){
  const acc=css('--accent'),acc2=css('--accent2'),warm=css('--warm'),pr=css('--price');
  {const v=V.slice(-36),o=base(),c=mk('cRev');o.xAxis.data=v.map(x=>x[0].slice(2).replace('-','/'));o.yAxis.scale=false;
   o.yAxis=[o.yAxis,{...o.yAxis,scale:true,splitLine:{show:false},axisLabel:{...o.yAxis.axisLabel,formatter:'{value}%'}}];
   o.series=[{name:'營收(億)',type:'bar',data:v.map(x=>x[1]),itemStyle:{color:acc,borderRadius:[2,2,0,0]},barCategoryGap:'25%'},
     {name:'年增率',type:'line',yAxisIndex:1,data:v.map(x=>x[2]),symbol:'none',lineStyle:{width:2,color:warm},itemStyle:{color:warm}}];
   c.setOption(o,true)}
  {const o=base(),c=mk('cMar');o.xAxis.data=Q.map(x=>x[0]);o.yAxis.axisLabel.formatter='{value}%';o.tooltip.valueFormatter=v=>v+'%';
   o.series=[['毛利率',2,acc],['營益率',3,acc2],['淨利率',4,warm]].map(([n,i,col])=>({name:n,type:'line',data:Q.map(x=>x[i]),showSymbol:false,lineStyle:{width:2,color:col},itemStyle:{color:col},endLabel:{show:true,formatter:p=>p.value,color:col,fontSize:10,fontFamily:'IBM Plex Mono'}}));
   o.grid.right=30;c.setOption(o,true)}
  {const o=base(),c=mk('cEps');o.xAxis.data=Q.map(x=>x[0]);o.yAxis.scale=false;
   const ttm=Q.map((x,i)=>i<3?null:+sum(Q.slice(i-3,i+1).map(z=>z[5])).toFixed(2));
   o.yAxis=[o.yAxis,{...o.yAxis,splitLine:{show:false}}];
   o.series=[{name:'單季EPS',type:'bar',data:Q.map(x=>x[5]),itemStyle:{color:acc2,borderRadius:[2,2,0,0]},label:{show:true,position:'top',fontSize:9,color:css('--muted'),fontFamily:'IBM Plex Mono',formatter:p=>p.dataIndex>=Q.length-4?p.value:''}},
     {name:'近四季',type:'line',yAxisIndex:1,data:ttm,symbol:'none',lineStyle:{width:2,color:warm},itemStyle:{color:warm}}];
   c.setOption(o,true)}
  renderFwd();river('cPE',PEM,2,'倍 PE');river('cPB',PBM,3,'倍 PB');
}
function renderFwd(){
  const m=model(),acc2=css('--accent2'),est=css('--est');
  const o=base(),c=mk('cFwd');o.yAxis.scale=false;
  const yrs=[m.y-3,m.y-2,m.y-1].map(y=>({y,e:sum(Q.filter(x=>x[0].startsWith(String(y).slice(2))).map(x=>x[5])),n:Q.filter(x=>x[0].startsWith(String(y).slice(2))).length})).filter(x=>x.n===4);
  const cats=[...yrs.map(x=>String(x.y)),m.y+'E',(m.y+1)+'E'];
  const act=[...yrs.map(x=>x.e),m.actY,null],es=[...yrs.map(()=>null),m.eY-m.actY,m.eN],tot=[...yrs.map(x=>x.e),m.eY,m.eN];
  o.xAxis.data=cats;o.tooltip.valueFormatter=v=>v==null?'-':v.toFixed(2);
  o.series=[{name:'已公布',type:'bar',stack:'e',data:act.map(v=>v==null?null:+v.toFixed(2)),itemStyle:{color:acc2},barWidth:'46%'},
    {name:'預估',type:'bar',stack:'e',data:es.map(v=>v==null?null:+v.toFixed(2)),itemStyle:{color:est,borderRadius:[3,3,0,0]},
     label:{show:true,position:'top',fontFamily:'IBM Plex Mono',fontSize:11,color:css('--fg'),formatter:p=>tot[p.dataIndex].toFixed(1)}}];
  o.grid.top=34;c.setOption(o,true);
  const rows=[...m.est.map(x=>[x.lbl,x.r,x.e,null]),[m.y+'E',m.rY,m.eY,L.close/m.eY],[(m.y+1)+'E',m.rN,m.eN,L.close/m.eN]];
  $('tbFwd').innerHTML='<tr><th>期間</th><th>營收(億)</th><th>EPS</th><th>本益比@'+fmt(L.close)+'</th></tr>'+
    rows.map(r=>`<tr class="e"><td>${r[0]}</td><td>${fmt(r[1])}</td><td>${r[2].toFixed(2)}</td><td>${r[3]==null?'—':r[3].toFixed(1)}</td></tr>`).join('');
  $('tFwd').innerHTML=`依目前假設，${m.y}E EPS <strong>${m.eY.toFixed(1)}</strong>、${m.y+1}E <strong>${m.eN.toFixed(1)}</strong>；以現價換算預估本益比 <strong>${(L.close/m.eY).toFixed(1)}</strong>／<strong>${(L.close/m.eN).toFixed(1)}</strong> 倍`;
  const miss=m.ms.filter((k,i)=>m.known[i]==null).map(k=>+k.slice(5)+'月');
  $('lMon').textContent=miss.length?`${miss.join('、')}營收估（億／月）`:'本季營收已全數公布';
  $('iMon').disabled=!miss.length;$('lYg').textContent=`${m.y+1} 營收年增（%）`;
  $('fFwd').textContent=`EPS = 營收 × 淨利率 ÷ ${fmt(D.shares,2)} 億股。預設值：未公布月份取本季已公布月份平均、淨利率取 ${window.__nmAbn?'近四季平均':Q[Q.length-1][0]+' 實績'}。`;
  if(window.__nmAbn)$('tFwd').innerHTML+=`<br><span class="pill">業外影響</span> ${Q[Q.length-1][0]} 淨利率 ${Q[Q.length-1][4]}% 高於營益率 ${Q[Q.length-1][3]}%，業外收益可能不會延續，預設改用近四季平均淨利率`;
}
function river(id,ms,col,unit){
  const o=base(),c=mk(id),cols=['--b1','--b2','--b3','--b4','--b5'].map(css);o.yAxis.scale=false;
  const rr=R.filter(r=>r[col]!=null&&r[col]>0);
  o.xAxis.data=rr.map(r=>r[0].slice(2).replace('-','/'));o.xAxis.boundaryGap=false;
  const s=[{name:ms[0]+unit,type:'line',stack:'r',data:rr.map(r=>+(r[col]*ms[0]).toFixed(2)),symbol:'none',lineStyle:{width:0},silent:true}];
  for(let i=1;i<ms.length;i++)s.push({name:ms[i]+unit,type:'line',stack:'r',data:rr.map(r=>+(r[col]*(ms[i]-ms[i-1])).toFixed(2)),symbol:'none',lineStyle:{width:0},areaStyle:{color:cols[i-1],opacity:1},silent:true});
  s.push({name:'股價',type:'line',data:rr.map(r=>r[1]),symbol:'none',lineStyle:{width:2.2,color:css('--price')},itemStyle:{color:css('--price')},z:5,endLabel:{show:true,formatter:p=>p.value,fontFamily:'IBM Plex Mono',fontSize:10,color:css('--price')}});
  o.series=s;o.legend.show=false;o.grid.right=34;o.grid.top=12;
  o.tooltip.formatter=ps=>{const r=rr[ps[0].dataIndex];let h=`<b>${r[0]}</b>　股價 ${fmt(r[1])}<br>`;for(let k=ms.length-1;k>=0;k--)h+=`${ms[k]}${unit}：${fmt(r[col]*ms[k])}<br>`;return h};
  c.setOption(o,true);
}
// ---------- 資料來源：預先抓好的 data/{id}.json，沒有的話即時向 FinMind 查 ----------
const FM='https://api.finmindtrade.com/api/v4/data';
let LIST=[],WATCH=[];
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
async function fm(dataset,id,start){
  const u=`${FM}?dataset=${dataset}&data_id=${id}&start_date=${start}`;
  const r=await fetch(u);let js={};try{js=await r.json()}catch(e){}
  if(r.status===402||js.status===402)throw new Error('FinMind 免費查詢額度已用完，請一小時後再試');
  if(!r.ok)throw new Error(`FinMind 回應錯誤（${r.status}）`);
  return js.data||[];
}
// 與 fetch.py 的 build() 相同邏輯
async function live(id){
  const y=new Date().getFullYear(),start=`${y-6}-01-01`,start2=`${y-7}-01-01`;
  const [px,per,fs,rv,bs]=await Promise.all([fm('TaiwanStockPrice',id,start),fm('TaiwanStockPER',id,start),fm('TaiwanStockFinancialStatements',id,start2),fm('TaiwanStockMonthRevenue',id,start2),fm('TaiwanStockBalanceSheet',id,`${y-2}-01-01`)]);
  if(!px.length)throw new Error(`查無 ${id} 的股價資料（可能是興櫃、已下市或代號錯誤）`);
  const cap=bs.filter(r=>r.type==='OrdinaryShare'||r.type==='CapitalStock').sort((a,b)=>a.date<b.date?-1:1);
  const shares=cap.length?cap[cap.length-1].value/10/1e8:null;
  const rvd={};rv.forEach(r=>{rvd[`${r.revenue_year}-${String(r.revenue_month).padStart(2,'0')}`]=r.revenue/1e8});
  const rev=Object.keys(rvd).sort().map(k=>{const p=rvd[`${+k.slice(0,4)-1}${k.slice(4)}`];return [k,Math.round(rvd[k]),p?+((rvd[k]/p-1)*100).toFixed(1):null]}).filter(r=>r[2]!=null);
  const qd={};fs.forEach(r=>{(qd[r.date]=qd[r.date]||{})[r.type]=r.value});
  const q=[];Object.keys(qd).sort().forEach(d=>{const o=qd[d],rv_=o.Revenue,ni=o.EquityAttributableToOwnersOfParent;
    let eps=o.EPS;if(eps==null&&ni!=null&&shares)eps=ni/1e8/shares;
    if(!rv_||eps==null)return;
    const pct=v=>v==null?null:+(v/rv_*100).toFixed(1);
    q.push([`${d.slice(2,4)}Q${+d.slice(5,7)/3}`,Math.round(rv_/1e8),pct(o.GrossProfit),pct(o.OperatingIncome),pct(ni),+eps.toFixed(2)])});
  const ml=rows=>{const m={};rows.slice().sort((a,b)=>a.date<b.date?-1:1).forEach(r=>m[r.date.slice(0,7)]=r);return m};
  const pm=ml(px),em=ml(per),riv=[];
  Object.keys(pm).sort().forEach(k=>{if(!em[k])return;const c=pm[k].close,pe=em[k].PER,pb=em[k].PBR;
    riv.push([k,c,pe?+(c/pe).toFixed(2):null,pb?+(c/pb).toFixed(2):null,pe,pb])});
  const P=px.slice().sort((a,b)=>a.date<b.date?-1:1),E=per.slice().sort((a,b)=>a.date<b.date?-1:1);
  const it=LIST.find(s=>s[0]===id);
  return {id,name:it?it[1]:id,live:true,updated:new Date().toISOString().slice(0,16)+'Z',shares:shares?+shares.toFixed(4):null,
    last:{date:P[P.length-1].date,close:P[P.length-1].close,prev:(P[P.length-2]||P[P.length-1]).close,pe:E.length?E[E.length-1].PER:null,pb:E.length?E[E.length-1].PBR:null},rev,q,riv};
}
async function getData(id){
  try{const r=await fetch(`data/${id}.json?t=${Date.now()}`);if(r.ok)return await r.json()}catch(e){}
  const k='live_'+id,c=store.get(k);
  if(c&&Date.now()-c.t<6*3600e3)return c.d;
  const d=await live(id);store.set(k,{t:Date.now(),d});return d;
}
async function load(id){
  document.body.classList.add('dim');$('asof').textContent=`載入 ${id} 中…`;$('err').hidden=true;
  try{
    const d=await getData(id);
    if(!d.riv.length||d.q.length<2||!d.rev.length)throw new Error(`${id} 的歷史資料不足（新上市、或財報格式不支援），無法繪圖`);
    D=d;L=D.last;R=D.riv;Q=D.q;V=D.rev;
    PEM=bands(R.map(r=>r[4]));PBM=bands(R.map(r=>r[5]));
    const m0=(()=>{const lq=qInfo(Q[Q.length-1][0]);let y=lq.y,n=lq.n+1;if(n>4){n=1;y++}
      const k=[1,2,3].map(i=>(V.find(x=>x[0]===`${y}-${String((n-1)*3+i).padStart(2,'0')}`)||[])[1]).filter(x=>x!=null);
      return k.length?sum(k)/k.length:Q[Q.length-1][1]/3})();
    $('iMon').value=Math.round(m0);const ql=Q[Q.length-1],nmAbn=ql[3]!=null&&ql[4]>ql[3]+5;window.__nmAbn=nmAbn;$('iNm').value=nmAbn?+(sum(Q.slice(-4).map(x=>x[4]))/4).toFixed(1):ql[4];$('iQg').value=5;$('iYg').value=15;
    const it=LIST.find(s=>s[0]===id);
    $('nm').textContent=D.name||(it&&it[1])||id;
    $('meta').innerHTML=(it?`${it[2]}・${it[3]}`:'')+(D.live?' <span class="live">即時查詢</span>':' <span class="live">追蹤清單</span>');
    document.title=`${D.id} ${$('nm').textContent} 估值看板`;
    header();render();
    const rec=(store.get('recent')||[]).filter(x=>x!==id);rec.unshift(id);store.set('recent',rec.slice(0,8));
  }catch(e){$('err').textContent='資料載入失敗：'+e.message;$('err').hidden=false;$('asof').textContent=''}
  document.body.classList.remove('dim');
}
// ---------- 搜尋 ----------
function row(s){return `<button type="button" data-id="${s[0]}"><span class="rid">${s[0]}</span><span>${s[1]}</span><span class="rmeta">${s[2]||''}${s[3]?'・'+s[3]:''}</span></button>`}
function showRes(){
  const v=$('q').value.trim(),box=$('res');let html='';
  if(!v){
    const w=WATCH.map(x=>LIST.find(s=>s[0]===x.id)||[x.id,x.name,'','']);
    const rc=(store.get('recent')||[]).filter(i=>!WATCH.some(x=>x.id===i)).map(i=>LIST.find(s=>s[0]===i)||[i,i,'','']);
    html=(w.length?'<div class="rhead">追蹤清單</div>'+w.map(row).join(''):'')+(rc.length?'<div class="rhead">最近查詢</div>'+rc.map(row).join(''):'');
  }else{
    const lv=v.toLowerCase();
    const hit=LIST.filter(s=>s[0].startsWith(v)||s[1].toLowerCase().includes(lv)).sort((a,b)=>(b[0].startsWith(v)-a[0].startsWith(v))||a[0].localeCompare(b[0])).slice(0,12);
    html=hit.length?hit.map(row).join(''):(/^\d{4}$/.test(v)?row([v,'直接查詢這個代號','','']):'<div class="rhead">找不到符合的股票</div>');
  }
  box.innerHTML=html;box.hidden=!html;
}
function pick(id){$('res').hidden=true;$('q').value='';$('q').blur();if(location.hash.slice(1)!==id)location.hash=id;else load(id)}
$('q').addEventListener('focus',showRes);
$('q').addEventListener('input',showRes);
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){const b=$('res').querySelector('button');if(b)pick(b.dataset.id)}if(e.key==='Escape'){$('res').hidden=true;$('q').blur()}});
$('res').addEventListener('mousedown',e=>e.preventDefault());
$('res').addEventListener('click',e=>{const b=e.target.closest('button');if(b)pick(b.dataset.id)});
document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('res').hidden=true});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(/^\d{4,6}[A-Z]?$/.test(id))load(id)});
(async()=>{
  try{const r=await fetch('data/index.json?t='+Date.now());if(r.ok)WATCH=await r.json()}catch(e){}
  try{const r=await fetch('data/list.json?t='+Date.now());if(r.ok)LIST=await r.json()}catch(e){}
  if(!LIST.length){const c=store.get('list');if(c&&Date.now()-c.t<7*864e5)LIST=c.d;else{try{
    const r=await fetch(`${FM}?dataset=TaiwanStockInfo`);const js=await r.json();const m={};
    (js.data||[]).filter(s=>(s.type==='twse'||s.type==='tpex')&&/^[1-9]\d{3}$/.test(s.stock_id)).forEach(s=>{if(!m[s.stock_id]||s.date>m[s.stock_id].date)m[s.stock_id]=s});
    LIST=Object.values(m).map(s=>[s.stock_id,s.stock_name,s.type==='twse'?'上市':'上櫃',s.industry_category]).sort((a,b)=>a[0].localeCompare(b[0]));store.set('list',{t:Date.now(),d:LIST})}catch(e){}}}
  const want=location.hash.slice(1);
  load(/^\d{4,6}[A-Z]?$/.test(want)?want:(WATCH[0]?.id||'2330'));
})();
['iMon','iNm','iQg','iYg'].forEach(id=>$(id).addEventListener('input',()=>D&&renderFwd()));
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>Object.values(charts).forEach(c=>c.resize()),120)});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>D&&render());
</script>
