<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>處置後統計</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 處置後報酬統計（2026-10-29，beta 確認後轉正）：回答「處置結束後會不會噴？」
   資料＝data/notice/dis_hist.json（fetch_notice.py 每日累積，上市回補 60 天、上櫃自 2026/10/29 起）＋ data/chip_s 分片收盤價。
   全部在前端算：處置最後一天收盤為基準，+1／+3／+5／+10 個交易日的報酬與勝率。 */
:root{
  --bg:#f3f4f6; --card:#ffffff; --fg:#151a23; --muted:#5d6675; --line:#e2e5ea;
  --accent:#1f5fbf; --up:#d32f2f; --down:#138a4b; --chip:#eef0f4; --sel:#151a23; --selfg:#fff;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --card:#171b23; --fg:#e8ebf0; --muted:#97a0ae; --line:#272d38;
  --accent:#6aa1ff; --up:#ff5b5b; --down:#35c27a; --chip:#222835; --sel:#e8ebf0; --selfg:#151a23; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent);text-decoration:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hd{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 8px 5px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none}
.hd::-webkit-scrollbar{display:none}
.t{flex:none;font-weight:900;font-size:15px}
.t i{font-style:normal;font-size:10px;font-weight:700;color:var(--selfg);background:#c46a12;border-radius:4px;padding:1px 4px;vertical-align:2px;margin-left:2px}
.hd button{flex:none;height:26px;line-height:26px;padding:0 10px;border-radius:13px;background:var(--chip);font-size:12.5px;white-space:nowrap}
.hd button[aria-pressed=true]{background:var(--sel);color:var(--selfg);font-weight:700}
.hd a.home{flex:none;font-size:12px;color:var(--muted);margin-left:auto}
.wrap{padding:8px 8px 20px;max-width:860px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.card h2{font-size:13.5px;margin:0 0 6px}
.card h2 span{font-weight:400;font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-size:11px;color:var(--muted);font-weight:500;text-align:right;padding:2px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:3px 4px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.nm{font-family:var(--f-body);font-weight:700;max-width:92px;overflow:hidden;text-overflow:ellipsis}
td.nm a{color:inherit}
td.nm .cd{font:500 10.5px var(--f-num);color:var(--muted);margin-left:3px}
td.nm .mk{font-size:9px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 2px;margin-left:2px}
.big td{font-weight:600;font-size:13px}
.hint{font-size:11px;color:var(--muted);line-height:1.55;margin-top:6px}
.hint b{color:var(--fg)}
.empty{padding:40px 12px;text-align:center;color:var(--muted);font-size:13px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.foot{font-size:11px;color:var(--muted);line-height:1.55;padding:2px 4px 10px}
</style>
</head>
<body>
<div class="hd">
  <span class="t">📊 處置後統計</span>
  <button data-m="" aria-pressed="true">全部</button><button data-m="上市">上市</button><button data-m="上櫃">上櫃</button>
  <a class="home" href="notice.html#dpost">← 注意／處置</a>
</div>
<div class="wrap" id="wrap"><div class="empty">計算中…</div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sgn=(x,d=1)=>x==null?'—':(x>0?'+':'')+(x*100).toFixed(d)+'%';
const cls=x=>x==null?'':x>0?'up':x<0?'dn':'';
const md=d=>d?+d.slice(4,6)+'/'+ +d.slice(6,8):'';
let MK='',ROWS=[],ASOF='';
const H=[1,3,5,10];
async function init(){
  const dh=await fetch('data/notice/dis_hist.json?t='+Math.floor(Date.now()/3e5)).then(r=>r.ok?r.json():null).catch(()=>null);
  if(!dh||!Object.keys(dh).length){$('#wrap').innerHTML='<div class="empty">還沒有處置歷史（排程跑過新版後開始累積）</div>';return}
  const recs=Object.values(dh);
  const SHARD={};
  await Promise.all([...new Set(recs.map(r=>r.c.slice(0,2)))].map(async g=>{try{const r=await fetch('data/chip_s/'+g+'.json?t='+Math.floor(Date.now()/600000));if(r.ok)SHARD[g]=await r.json()}catch(e){}}));
  // 列＝[收盤,…]；以處置最後一天（≤迄日的最後一個有收盤的交易日）為基準
  for(const v of recs){
    const s=SHARD[v.c.slice(0,2)];if(!s||!s.d||!s.d[v.c])continue;
    const days=s.days,rows=s.d[v.c];
    const px=i=>rows[i]&&rows[i][0]!=null?rows[i][0]:null;
    let iE=-1,iS=-1;days.forEach((d,i)=>{if(d<=v.end&&px(i)!=null)iE=i;if(iS<0&&d>=v.start)iS=i});
    if(iE<0||days[days.length-1]<=v.end)continue;                        // 還沒結束或資料不足
    ASOF=days[days.length-1];
    const base=px(iE);if(!base)continue;
    const r={...v,during:null,rets:{}};
    const pre=iS>0?px(iS-1):null;if(pre)r.during=base/pre-1;             // 處置期間漲跌（進處置前一天收盤→最後一天收盤）
    H.forEach(h=>{let j=iE,hit=0;while(j<days.length-1&&hit<h){j++;if(px(j)!=null)hit++}r.rets[h]=hit===h&&px(j)!=null?px(j)/base-1:null});
    r.maxN=days.length-1-iE;
    ROWS.push(r);
  }
  ROWS.sort((a,b)=>b.end<a.end?-1:b.end>a.end?1:0);
  document.querySelector('.hd').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;MK=b.dataset.m;document.querySelectorAll('.hd button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));paint()});
  paint();
}
function stat(arr){const a=arr.filter(x=>x!=null);if(!a.length)return null;const s=[...a].sort((x,y)=>x-y);
  return {n:a.length,win:a.filter(x=>x>0).length/a.length,avg:a.reduce((p,c)=>p+c,0)/a.length,med:s.length%2?s[(s.length-1)/2]:(s[s.length/2-1]+s[s.length/2])/2}}
function paint(){
  const R=ROWS.filter(r=>!MK||r.m===MK);
  if(!R.length){$('#wrap').innerHTML='<div class="empty">這個市場還沒有已結束的處置樣本</div>';return}
  const sum=H.map(h=>({h,...(stat(R.map(r=>r.rets[h]))||{n:0})}));
  const dur=stat(R.map(r=>r.during));
  $('#wrap').innerHTML=`
  <div class="card"><h2>結束後報酬 <span>基準＝處置最後一天收盤・樣本 ${R.length} 檔次</span></h2>
    <table class="big"><tr><th>結束後</th><th>樣本</th><th>勝率</th><th>平均</th><th>中位數</th></tr>
    ${sum.map(s=>`<tr><td style="font-family:var(--f-body)">+${s.h} 日</td><td>${s.n||'—'}</td><td class="${s.n?(s.win>=.5?'up':'dn'):''}">${s.n?Math.round(s.win*100)+'%':'—'}</td><td class="${cls(s.avg)}">${s.n?sgn(s.avg):'—'}</td><td class="${cls(s.med)}">${s.n?sgn(s.med):'—'}</td></tr>`).join('')}
    </table>
    <div class="hint">${dur?`參考：這些股票<b>處置期間</b>平均 <b class="${cls(dur.avg)}">${sgn(dur.avg)}</b>（勝率 ${Math.round(dur.win*100)}%）。`:''}勝率＝結束後第 N 個交易日收盤高於基準的比例。<b>樣本還很少，先看、先累積，別急著當進場訊號</b>——目前樣本集中在同一段行情（10 月處置潮），同漲同跌會高估規律性；至少累積 1～2 個月、樣本 50+ 再下結論，也要小心只記得漲的那幾檔（倖存者偏差）。</div>
  </div>
  <div class="card"><h2>各檔明細 <span>新結束在前・點股名看財報</span></h2><div class="scroll">
    <table><tr><th>股票</th><th>結束</th><th>期間</th><th>+1</th><th>+3</th><th>+5</th><th>+10</th></tr>
    ${R.map(r=>`<tr><td class="nm"><a href="index.html#${esc(r.c)}">${esc(r.n)}</a><span class="cd">${esc(r.c)}</span><span class="mk">${esc(r.m)}</span></td>
      <td style="font-size:11px;color:var(--muted)" title="${md(r.start)}~${md(r.end)}">${md(r.end)}</td>
      <td class="${cls(r.during)}">${sgn(r.during)}</td>
      ${H.map(h=>`<td class="${cls(r.rets[h])}">${r.rets[h]==null?(r.maxN<h?'…':'—'):sgn(r.rets[h])}</td>`).join('')}</tr>`).join('')}
    </table></div>
    <div class="hint">「…」＝結束未滿 N 個交易日，之後會自己補上。期間＝進處置前一天收盤 → 處置最後一天收盤（處置期間漲跌）。表可左右滑。</div>
  </div>
  <p class="foot">資料：data/notice/dis_hist.json（每個交易日 17:25 後自動累積；上市已回補近 60 天處置公告，上櫃官方只提供最近兩天、自 2026/10/29 起累積）＋ 本站日K收盤價${ASOF?`（至 ${md(ASOF)}）`:''}。紅＝漲／綠＝跌。本頁不構成投資建議。</p>`;
}
init();
</script>
</body>
</html>
