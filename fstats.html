<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>主力訊號統計</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 🔥 主力訊號「上榜後 N 日報酬」統計（2026-11-15）：回答「這個訊號準不準？該在連續符合的第幾天進場？」
   資料＝data/fire_stats.json（fire_stats.py 由 fire_hist.py 結尾呼叫，全市場事件；每次排程重算）。前端只負責畫。 */
:root{
  --bg:#f3f4f6; --card:#ffffff; --fg:#151a23; --muted:#5d6675; --line:#e2e5ea;
  --accent:#1f5fbf; --up:#d32f2f; --down:#138a4b; --chip:#eef0f4; --sel:#151a23; --selfg:#fff; --upRGB:211,47,47; --dnRGB:19,138,75;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --card:#171b23; --fg:#e8ebf0; --muted:#97a0ae; --line:#272d38;
  --accent:#6aa1ff; --up:#ff5b5b; --down:#35c27a; --chip:#222835; --sel:#e8ebf0; --selfg:#151a23; --upRGB:255,91,91; --dnRGB:53,194,122; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent);text-decoration:none}
.up{color:var(--up)}.dn{color:var(--down)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hd{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 8px 5px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.t{flex:none;font-weight:900;font-size:15px}
.hd a.home{flex:none;font-size:12px;color:var(--muted);margin-left:auto}
.seg{display:flex;gap:4px;margin:0 0 6px}
.seg button{flex:1;height:28px;border-radius:14px;background:var(--chip);font-size:12.5px;white-space:nowrap;padding:0 2px}
.seg button[aria-pressed=true]{background:var(--sel);color:var(--selfg);font-weight:700}
.wrap{padding:8px 8px 20px;max-width:860px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.card h2{font-size:13.5px;margin:0 0 6px}
.card h2 span{font-weight:400;font-size:11px;color:var(--muted)}
.key{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.6}
.key li{padding:2px 0 2px 1.5em;text-indent:-1.5em}
.key b{font-family:var(--f-num);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
th{font-size:11px;color:var(--muted);font-weight:500;text-align:right;padding:3px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
th.h{cursor:pointer}th.h.on{color:var(--fg);font-weight:800;text-decoration:underline;text-underline-offset:3px}
th:first-child,td:first-child{text-align:left;padding-left:0;width:31%}
td{padding:5px 4px;text-align:right;border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-family:var(--f-body);font-weight:700;font-size:12.5px}
td small{display:block;font:500 10px var(--f-num);color:var(--muted)}
tr.all td{border-top:2px solid var(--line);border-bottom:0}
tr.base td{border-bottom:0;color:var(--muted);font-weight:400}tr.base td:first-child{font-weight:500}
td.sel{outline:1.5px solid var(--fg);outline-offset:-2px;border-radius:4px}
.bars{display:grid;grid-template-columns:31% 1fr 52px;row-gap:5px;align-items:center;font-size:12.5px}
.bars .lb{font-weight:700}.bars .v{text-align:right;font-family:var(--f-num)}
.bars .tr{position:relative;height:16px;background:linear-gradient(var(--line),var(--line)) 50% 0/1px 100% no-repeat}
.bars .tr i{position:absolute;top:2px;height:12px;border-radius:2px}
.hint{font-size:11px;color:var(--muted);line-height:1.55;margin-top:6px}
.hint b{color:var(--fg)}
.empty{padding:40px 12px;text-align:center;color:var(--muted);font-size:13px}
.foot{font-size:11px;color:var(--muted);line-height:1.6;padding:2px 4px 10px}
.foot b{color:var(--fg)}
</style>
</head>
<body>
<div class="hd"><span class="t">📊 主力訊號統計</span><a class="home" href="index.html">← 首頁</a></div>
<div class="wrap" id="wrap"><div class="empty">載入中…</div></div>
<script>
const $=s=>document.querySelector(s);
const pc=(x,d=1)=>x==null?'—':(x>0?'+':'')+(x*100).toFixed(d)+'%',wr=x=>x==null?'—':(x*100).toFixed(0)+'%';
const cls=x=>x==null?'':x>0?'up':x<0?'dn':'',md=d=>d?+d.slice(4,6)+'/'+ +d.slice(6,8):'';
let D=null,E='e1',M='ex',H='5';
// 指標：[鍵, 按鈕字, 標題, 格式, 著色用的中心與滿格幅度]
const MET={ex:['超額','超額報酬（贏大盤多少）',pc,0,.03],avg:['平均','平均報酬',pc,0,.05],win:['勝率','勝率（報酬 > 0 的比例）',wr,.5,.3],med:['中位數','中位數報酬（一般情況）',pc,0,.05],p10:['最差10%','最差 10% 的報酬（十次有一次比這更慘）',pc,0,.2]};
const tint=(v,m)=>{if(v==null)return '';const [, , ,c,r]=MET[m],x=Math.max(-1,Math.min(1,(v-c)/r));return `background:rgba(${x>0?'var(--upRGB)':'var(--dnRGB)'},${(Math.abs(x)*.30).toFixed(2)})`};
function cell(k,h){return D.s[E][k]&&D.s[E][k][h]||null}
function draw(){
  if(!D){$('#wrap').innerHTML='<div class="empty">還沒有統計資料（排程跑完後就會出現）</div>';return}
  const B=D.buckets,hs=D.hs.map(String),m=MET[M],fmt=m[2],entry=E==='e1'?'隔天收盤':'當天收盤';
  const all=cell('all',H)||{},rank=B.filter(([k])=>k!=='all').map(([k,lb])=>[lb,cell(k,H)]).filter(x=>x[1]&&x[1].ex!=null).sort((a,b)=>b[1].ex-a[1].ex),best=rank[0],worst=rank[rank.length-1];
  const weak=all.base!=null&&all.base<-0.005,strong=all.base!=null&&all.base>0.005;
  const key=`<ul class="key">
    <li>📌 全部 🔥 ${entry}買進、抱 ${H} 日：勝率 <b>${wr(all.win)}</b>、平均 <b class="${cls(all.avg)}">${pc(all.avg)}</b>；同期全市場 <b class="${cls(all.base)}">${pc(all.base)}</b> → 超額 <b class="${cls(all.ex)}">${pc(all.ex)}</b></li>
    ${best&&worst&&best!==worst?`<li>${best[1].ex>0?'✅':'➖'} 相對最好：<b style="font-family:inherit">${best[0]}</b>進場，超額 <b class="${cls(best[1].ex)}">${pc(best[1].ex)}</b>、勝率 <b>${wr(best[1].win)}</b></li>
    <li>⚠️ 相對最差：<b style="font-family:inherit">${worst[0]}</b>進場，超額 <b class="${cls(worst[1].ex)}">${pc(worst[1].ex)}</b>、勝率 <b>${wr(worst[1].win)}</b>、最差 10% <b class="dn">${pc(worst[1].p10)}</b></li>`:''}
    ${weak?`<li>🌧️ 這段期間大盤偏弱（全市場中位數抱 ${H} 日 ${pc(all.base)}），絕對報酬偏低屬正常，<b style="font-family:inherit">要看超額</b></li>`:strong?`<li>☀️ 這段期間大盤偏強，勝率高不一定是訊號的功勞，<b style="font-family:inherit">要看超額</b></li>`:''}
  </ul>`;
  const th=hs.map(h=>`<th class="h${h===H?' on':''}" data-h="${h}">${h}日</th>`).join('');
  const row=([k,lb])=>`<tr class="${k==='all'?'all':''}"><td>${lb}<small>${(cell(k,H)||{}).n??0} 筆</small></td>${hs.map(h=>{const c=cell(k,h),v=c?c[M]:null;return `<td class="${M==='win'?'':cls(v)}${h===H?' sel':''}" style="${tint(v,M)}">${fmt(v)}</td>`}).join('')}</tr>`;
  const baseRow=M==='avg'||M==='ex'?`<tr class="base"><td>對照：全市場</td>${hs.map(h=>{const c=cell('all',h);return `<td>${pc(c&&c.base)}</td>`}).join('')}</tr>`:'';
  const mx=Math.max(.001,...B.map(([k])=>{const c=cell(k,H),v=c?c[M]:null;return v==null?0:Math.abs(v-m[3])}));
  const bars=B.map(([k,lb])=>{const c=cell(k,H),v=c?c[M]:null,x=v==null?0:(v-m[3])/mx*48;
    return `<span class="lb">${lb}</span><span class="tr"><i style="${x>=0?'left:50%':'right:50%'};width:${Math.abs(x).toFixed(1)}%;background:var(--${x>=0?'up':'down'})"></i></span><span class="v ${M==='win'?'':cls(v)}">${fmt(v)}</span>`}).join('');
  $('#wrap').innerHTML=`
  <div class="card"><h2>結論 <span>${md(D.from)}～${md(D.to)}・${D.nDays} 個交易日・全市場 ${D.nEv.toLocaleString()} 筆</span></h2>${key}</div>
  <div class="card">
    <div class="seg" id="segE"><button data-e="e1" aria-pressed="${E==='e1'}">隔天收盤買（買得到）</button><button data-e="e0" aria-pressed="${E==='e0'}">當天收盤買（理想值）</button></div>
    <div class="seg" id="segM">${Object.entries(MET).map(([k,v])=>`<button data-m="${k}" aria-pressed="${k===M}">${v[0]}</button>`).join('')}</div>
    <h2>${m[1]} <span>列＝連續符合 🔥 的第幾天進場・欄＝抱幾個交易日</span></h2>
    <table><thead><tr><th>進場時機</th>${th}</tr></thead><tbody>${B.map(row).join('')}${baseRow}</tbody></table>
    <p class="hint">點「1日／3日／5日／10日」換下面的圖與上面的結論。${M==='win'?'底色：<b>紅＝高於 50%、綠＝低於 50%</b>。':'底色越深＝數字越大（紅正、綠負）。'}</p>
  </div>
  <div class="card"><h2>抱 ${H} 日的${m[0]} <span>${entry}買進${M==='win'?'・中線＝50%':''}</span></h2><div class="bars">${bars}</div></div>
  <p class="foot"><b>怎麼算</b>：事件＝全市場任何一檔在某天符合 🔥（月漲幅 &gt; 0、量比 ≥ 1.5、投信或外資 5 日買超 ≥ 5 日成交量 1%）。「第 N 天」＝已連續符合幾個交易日；🆕 第 1 天＝首頁標「🆕新進」那天。報酬＝收盤對收盤、還原除權息。<b>超額</b>＝個股報酬 − 同一天進場、抱同樣天數的全市場中位數。<br>
  <b>限制</b>：① 只有 ${D.nDays} 個交易日、單一行情，結論會隨行情變，不是定律；② 同一檔連續上榜會重複計算，事件彼此不獨立，實際可信度比筆數看起來低；③ 沒算手續費、證交稅（來回約 0.6%）與漲停買不到；④ 是全市場統計，不是只算你的主題＋自選。<br>
  價到 ${md(D.pxAsof)}・每次排程重算 <span style="opacity:.5">v1115t</span></p>`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-e],[data-m],[data-h]');if(!b)return;if(b.dataset.e)E=b.dataset.e;if(b.dataset.m)M=b.dataset.m;if(b.dataset.h)H=b.dataset.h;draw()});
fetch('data/fire_stats.json?t='+Math.floor(Date.now()/3e5)).then(r=>r.ok?r.json():null).catch(()=>null).then(j=>{D=j&&j.s?j:null;draw()});
</script>
</body>
</html>
