<html lang="zh-Hant-TW">
<head>

<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">

<style>
/* 注意／處置股（2026-10-29）：五頁籤 注意／處置／快達處置／⏳快結束／✅剛結束 ＋ 上市上櫃篩選。
   名單來自 data/notice.json（fetch_notice.py 每日 17:25 抓證交所＋櫃買；dend/dpost 由 data/notice/dis_hist.json 累積），
   小 K 來自 data/chip_s 分片（與掃描頁同一份）；K 圖紅色底色＝處置期間。統計見 stats.html。2026-10-29 beta 確認後併入。 */
:root{
  --bg:#f3f4f6; --card:#ffffff; --fg:#151a23; --muted:#5d6675; --line:#e2e5ea; --grid:#eceef2;
  --accent:#1f5fbf; --warm:#c46a12; --up:#d32f2f; --down:#138a4b; --y:#b88600; --o:#d9731a;
  --ma20:#9b3fb5; --ma60:#6b7280; --chip:#eef0f4; --sel:#151a23; --selfg:#fff;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --card:#171b23; --fg:#e8ebf0; --muted:#97a0ae; --line:#272d38; --grid:#232833;
  --accent:#6aa1ff; --warm:#f0a04b; --up:#ff5b5b; --down:#35c27a; --y:#f0c84b; --o:#ff9a4b; --ma20:#c77ddb; --ma60:#8b93a1; --chip:#222835; --sel:#e8ebf0; --selfg:#151a23; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent);text-decoration:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hd{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 8px 4px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row+.row{margin-top:5px}
.t{flex:none;font-weight:900;font-size:15px}
.hd a.home{flex:none;font-size:12px;color:var(--muted);margin-left:auto}
.tab{flex:none;height:30px;line-height:30px;padding:0 11px;border-radius:15px;background:var(--chip);font-size:13px;font-weight:500;white-space:nowrap}
.tab b{font-family:var(--f-num);font-weight:600;margin-left:3px;opacity:.75}
.tab[aria-pressed=true]{background:var(--sel);color:var(--selfg);font-weight:700}
.tab[aria-pressed=true] b{opacity:1}
.sb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted);padding:4px 8px 0}
.sb .brk{flex-basis:100%;height:0}
.sb select{flex:none;height:26px;padding:0 4px;border-radius:13px;border:1px solid var(--accent);background:var(--card);color:var(--fg);font-size:16px;font-weight:500;max-width:40vw}
.sb select.old{background:#fef3c7;border-color:#b45309;color:#7c2d12}
.sb select.nx{background:#dbeafe;border-color:#1d4ed8;color:#1e3a8a}
.sb #chgBtn i{font-style:normal;font-weight:400;opacity:.45;padding:0 1px}
.sb #chgBtn i.on{font-weight:800;opacity:1;text-decoration:underline;text-underline-offset:2px}
.sb::-webkit-scrollbar{display:none}
.sb .lab{flex:none;font-weight:700;color:var(--fg)}
.sb button,.sb a.sc{flex:none;height:24px;line-height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--fg);white-space:nowrap}
.sb button[aria-pressed=true]{background:var(--sel);color:var(--selfg);border-color:var(--sel);font-weight:700}
.sb a.sc{color:var(--accent);border-color:var(--accent);font-weight:700;margin-left:auto}
.sb #noteBtn{width:24px;padding:0;font-size:14px;color:var(--muted)}
.sb #noteBtn[aria-pressed=true]{background:var(--sel);color:var(--selfg);border-color:var(--sel)}
.sb .sep{flex:none;width:1px;height:16px;background:var(--line);margin:0 2px}
.cnt{padding:4px 10px 0;font-size:11.5px;color:var(--muted)}
.cnt b{color:var(--fg)}
.list{display:grid;grid-template-columns:1fr;gap:5px;padding:6px 6px 14px}
@media (min-width:700px){.list{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.list{grid-template-columns:repeat(3,1fr)}}
.nc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px 5px;display:grid;grid-template-columns:1fr 112px;grid-template-rows:auto auto;gap:2px 8px;min-width:0;position:relative}
.nc.dis{border-color:var(--up)}
.nc.warn{border-color:var(--o)}
.nc.post{border-color:var(--accent)}
.nc-h{display:flex;align-items:baseline;gap:5px;min-width:0;line-height:17px;flex-wrap:wrap}
.nc-h a.nm{font-size:14.5px;font-weight:900;color:inherit;white-space:nowrap}
.nc-h .cd{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.nc-h .mk{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px;line-height:14px}
.nc-h .px{font-family:var(--f-num);font-weight:600;font-size:13px;margin-left:auto}
.nc-h .ch{font-family:var(--f-num);font-size:12px;font-weight:600}
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11px;grid-column:1}
.tg{border-radius:4px;padding:0 5px;line-height:17px;background:var(--chip);color:var(--fg);white-space:nowrap}
.tg.y{background:color-mix(in srgb,var(--y) 18%,transparent);color:var(--y);font-weight:700}
.tg.o{background:color-mix(in srgb,var(--o) 18%,transparent);color:var(--o);font-weight:700}
.tg.r{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up);font-weight:700}
.tg.a{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);font-weight:700}
.tg.g{color:var(--muted)}
.tg b{font-family:var(--f-num);font-weight:600}
.rs{grid-column:1 / -1;font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.nc.open .rs{display:block;-webkit-line-clamp:unset;color:var(--fg)}
.rs .dt{display:none;color:var(--muted);font-size:11.5px}
.nc.open .rs .dt{display:inline}
.rs i{font-style:normal;color:var(--accent);font-size:11px;margin-left:4px}
.nc.open .rs i{display:none}
.rs em{font-style:normal;color:var(--up);font-weight:700;font-family:var(--f-num)}
.kv{grid-column:2;grid-row:1 / span 2;width:112px;height:56px;display:block;align-self:start;justify-self:end}
.kv.none{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);border:1px dashed var(--line);border-radius:5px}
.foot{padding:4px 12px 20px;font-size:11px;color:var(--muted);line-height:1.5}
.empty{padding:40px 12px;text-align:center;color:var(--muted);font-size:13px}
.note{margin:6px 8px 0;padding:6px 9px;border-radius:7px;background:var(--card);border:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
.note b{color:var(--fg)}
.note.hid{display:none}
</style>
</head>
<body>
<div class="hd">
  <div class="row">
    <span class="t">📢 注意／處置</span>
    <button class="tab" data-tab="att" aria-pressed="true">🟡 注意<b id="nAtt">—</b></button>
    <button class="tab" data-tab="dis" aria-pressed="false">🔴 處置<b id="nDis">—</b></button>
    <button class="tab" data-tab="pre" aria-pressed="false">🟠 快達處置<b id="nPre">—</b></button>
    <button class="tab" data-tab="dend" aria-pressed="false">⏳ 快結束<b id="nEnd">—</b></button>
    <button class="tab" data-tab="dpost" aria-pressed="false">✅ 剛結束<b id="nPost">—</b></button>
    <a class="home" href="index.html">← 估值看板</a>
  </div>
</div>
<div class="sb" id="bar">
  <select id="daySel" aria-label="名單日期"><option value="">最新</option></select>
  <span class="sep"></span><button data-m="" aria-pressed="true">全部</button><button data-m="上市">上市</button><button data-m="上櫃">上櫃</button><a class="sc" id="scanLink" href="scan.html#natt">📈 掃 K 線</a><button id="noteBtn" aria-pressed="false" aria-label="說明">ⓘ</button>
  <span class="brk"></span>
  <button data-s="def" aria-pressed="true" id="defBtn">連續天</button><button data-s="chg" id="chgBtn">漲幅</button><button data-s="vr">量比</button><button data-s="n30" id="n30Btn">30日次數</button><button data-s="ret" id="retBtn" hidden>結束後</button>
</div>
<div class="cnt" id="cnt"></div>
<div class="note hid" id="note"></div>
<div class="list" id="list"><div class="empty">讀取中…</div></div>
<p class="foot" id="foot"></p>
<script>
function ntStale(N){const a=N&&N.asof,m=N&&N.mkAsof;if(!a||!m)return '';const f=d=>(+d.slice(4,6))+'/'+(+d.slice(6));const L=['上市','上櫃'].filter(k=>!m[k]||m[k]<a);if(L.length!==1)return '';const k=L[0];return `⚠️ ${k}還停在 ${m[k]?f(m[k]):'前一日'}，目前只有${k==='上櫃'?'上市':'上櫃'}`}
function ntDemo(N){if(N&&N.asof&&/[?&]stale=1/.test(location.search)){const d=new Date(+N.asof.slice(0,4),+N.asof.slice(4,6)-1,+N.asof.slice(6)-1);N.mkAsof={'上市':N.asof,'上櫃':''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}}return N}

function mzN(s){return String(s||'').replace(/每\s*([一二三四五六七八九十]+)\s*分鐘/,(m,c)=>{const d='一二三四五六七八九'.indexOf.bind('一二三四五六七八九');let n=0;const i=c.indexOf('十');if(i<0)n=d(c)+1;else n=(i>0?d(c[i-1])+1:1)*10+(i<c.length-1?d(c[i+1])+1:0);return '每'+n+'分鐘'})}

const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pxFmt=p=>p==null?'—':p>=1000?fmt(p,0):p>=100?fmt(p,1):fmt(p,2);
const pct=(x,d=1)=>x==null?'—':(x>0?'▲':x<0?'▼':'')+Math.abs(x*100).toFixed(d)+'%';
const sgn=(x,d=1)=>x==null?'—':(x>0?'+':'')+(x*100).toFixed(d)+'%';
const cls=x=>x>0?'up':x<0?'dn':'';
const md=d=>d?+d.slice(4,6)+'/'+ +d.slice(6,8):'';
let D=null,TAB='att',MK='',SORT='def',SHARD={},K={},LR=[];
let DAY='',HIST=null,DH=null,NAMES={},HR=null,CHGP='d';   // DAY=''＝最新；HR＝選定日回推的五名單；CHGP＝漲幅鈕 d／w／m
let PREV=null,CURD='',NEXTD='';   // CURD＝目前適用的名單日（同 XQ）；NEXTD＝今晚新公布、下個交易日才適用的名單日（沒有就是 ''）
const TODAY=(()=>{const q=(location.search.match(/[?&]today=(\d{8})/)||[])[1];if(q)return q;return new Date(Date.now()+8*3600e3).toISOString().slice(0,10).replace(/-/g,'')})();
const SRC=()=>(DAY===D.asof?D:PREV&&DAY===PREV.asof?PREV:HR)||D;
const LST=k=>SRC()[k]||[];
const missMk=()=>{const m=D.mkAsof;if(!m)return '';const L=['上市','上櫃'].filter(k=>!m[k]||m[k]<D.asof);return L.length===1?L[0]:''};
// 目前適用 vs 明日：同一頁籤的代號差異（上櫃還沒公布時，上櫃股不算移出，標待公布）
function nxInfo(k){if(!NEXTD||!PREV||!['att','dis','pre'].includes(k))return null;const a=PREV[k]||[],b=D[k]||[],A=new Set(a.map(x=>x.c)),B=new Set(b.map(x=>x.c)),mm=k==='dis'?'':missMk();
  return {A,B,mm,add:b.filter(x=>!A.has(x.c)).length,keep:a.filter(x=>B.has(x.c)).length,out:a.filter(x=>!B.has(x.c)&&x.m!==mm).length,wait:mm?a.filter(x=>!B.has(x.c)&&x.m===mm).length:0}}
const CHGK=()=>CHGP==='w'?'w':CHGP==='m'?'mo':'chg';
const WK='日一二三四五六';const wkd=d=>WK[new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6)).getDay()];
function wdCount(a,b){if(!a||!b||a>=b)return 0;let n=0;const x=new Date(+a.slice(0,4),+a.slice(4,6)-1,+a.slice(6));for(let i=0;i<120;i++){x.setDate(x.getDate()+1);const s=x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0');if(s>b)break;if(x.getDay()%6)n++}return n}
// 用 hist.json＋dis_hist.json 回推選定日的五名單（原因全文只有最新一天有；快達處置一律用次數估算）
function histAll(day){const nm=c=>(NAMES[c]||[])[0]||c,mk=c=>(NAMES[c]||[])[1]||'';
  const days=Object.keys(HIST).filter(d=>d<=day&&(HIST[d].att||[]).length).sort(),att=d=>(HIST[d]||{}).att||[];
  const cnt=(c,w)=>days.slice(-w).filter(d=>att(d).includes(c)).length,streak=c=>{let n=0;for(let i=days.length-1;i>=0&&att(days[i]).includes(c);i--)n++;return n};
  const DHv=Object.values(DH||{}).filter(v=>v&&v.c&&v.end);
  const act={};DHv.filter(v=>v.start<=day&&day<v.end).forEach(v=>{if(!act[v.c]||v.end>act[v.c].end)act[v.c]=v});
  const dz=v=>({c:v.c,n:v.n||nm(v.c),m:v.m||mk(v.c),r:v.r||'',start:v.start,end:v.end,startMd:md(v.start),endMd:md(v.end),measure:v.measure||'',left:wdCount(day,v.end),n30:cnt(v.c,30)});
  const dis=Object.values(act).map(dz).sort((a,b)=>a.end<b.end?-1:a.end>b.end?1:0);
  const post={};DHv.filter(v=>v.end<=day&&wdCount(v.end,day)<=10&&!act[v.c]).forEach(v=>{if(!post[v.c]||v.end>post[v.c].end)post[v.c]=v});
  const a=att(day).map(c=>{const n10=cnt(c,10),n30=cnt(c,30);return {c,n:nm(c),m:mk(c),r:`${md(day)} 被列注意（原因全文只保留最新一天）`,streak:streak(c),n10,n30,warn:!act[c]&&(n10>=5||n30>=11)}});
  const set=new Set();days.slice(-30).forEach(d=>att(d).forEach(c=>set.add(c)));
  const pre=[...set].filter(c=>!act[c]).map(c=>({c,n:nm(c),m:mk(c),n10:cnt(c,10),n30:cnt(c,30),est:true})).filter(x=>x.n10>=5||x.n30>=11).map(x=>({...x,r:`估算：到 ${md(day)} 近 10 日 ${x.n10} 次、近 30 日 ${x.n30} 次列注意`}));
  return {att:a,dis,pre,dend:dis.filter(x=>x.left<=3),dpost:Object.values(post).map(v=>({...dz(v),ago:wdCount(v.end,day)}))}}
function tabCnt(){$('nAtt').textContent=LST('att').length;$('nDis').textContent=LST('dis').length;$('nPre').textContent=LST('pre').length;$('nEnd').textContent=LST('dend').length;$('nPost').textContent=LST('dpost').length}
async function ensureK(){const codes=[...new Set(['att','dis','pre','dend','dpost'].flatMap(k=>LST(k).map(x=>x.c)))];
  await Promise.all([...new Set(codes.map(c=>c.slice(0,2)))].map(g=>loadShard(g)));codes.forEach(c=>{if(K[c]===undefined)K[c]=kinfo(c)})}
async function setDay(d){DAY=d||CURD;const sel=$('daySel');sel.value=DAY;sel.classList.toggle('nx',!!NEXTD&&DAY===NEXTD);sel.classList.toggle('old',DAY!==CURD&&DAY!==NEXTD);
  if(DAY!==D.asof&&!(PREV&&DAY===PREV.asof)){if(!HIST){const [h,dh,ls]=await Promise.all(['data/notice/hist.json','data/notice/dis_hist.json','data/list.json'].map(u=>fetch(u+'?t='+Math.floor(Date.now()/3e5)).then(r=>r.ok?r.json():null).catch(()=>null)));HIST=h||{};DH=dh||{};(ls||[]).forEach(r=>NAMES[r[0]]=[r[1],r[2]])}
    HR=histAll(DAY);$('list').innerHTML='<div class="empty">讀取中…</div>'}else HR=null;
  await ensureK();tabCnt();paint()}
async function fillDays(){const sel=$('daySel');const head=()=>(NEXTD?`<option value="${NEXTD}">🆕明日 ${md(NEXTD)}</option>`:'')+`<option value="${CURD}">適用 ${md(CURD)}</option>`;
  sel.innerHTML=head();sel.value=DAY;sel.onchange=e=>setDay(e.target.value);
  try{const r=await fetch('data/notice/hist.json?t='+Math.floor(Date.now()/3e5));if(!r.ok)return;HIST0=await r.json()}catch(e){return}
  const ds=Object.keys(HIST0).filter(d=>d<CURD&&(HIST0[d].att||[]).length).sort().reverse().slice(0,40);
  sel.innerHTML=head()+ds.map(d=>`<option value="${d}">${md(d)}（${wkd(d)}）</option>`).join('');sel.value=DAY}
let HIST0=null;
const T={att:{def:'連續天',title:'注意股',tip:'<b>注意股</b>＝交易所依「最近六日漲幅、週轉率、本益比、成交量放大」等標準公布的過熱警示。<b>不是買進訊號</b>——被列注意後常見高開低走；若手上有，把它當減碼提醒。連續天數＝連續幾個交易日都在名單上；次數用本站紀錄算（上市已回補 2026/9/14 起，上櫃自 2026/10/27 起累積，所以上櫃 30 日次數前期會偏少）。'},
  dis:{def:'結束日',title:'處置股',tip:'<b>處置股</b>＝注意次數達標後改為「分盤撮合」（約每 2 分鐘撮合一次；2026/8/10 新制前為 5 或 20 分鐘）、可能要求預收款券，流動性大降、不能當沖。處置期間通常 5 個交易日（同時因當沖占比過高被列注意者 7 個；新制前為 10／12 個）。排序預設＝越快結束越前面；K 圖紅色底色＝處置期間。'},
