<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>注意／處置股</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1117" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 注意／處置股（2026-10-29 beta）：三頁籤（注意／處置／快達處置）＋ 上市上櫃篩選。名單來自 data/notice.json（fetch_notice.py 每日 17:25 抓證交所＋櫃買 OpenAPI），小 K 來自 data/chip_s 分片（與掃描頁同一份）。 */
:root{
  --bg:#f3f4f6; --card:#ffffff; --fg:#151a23; --muted:#5d6675; --line:#e2e5ea; --grid:#eceef2;
  --accent:#1f5fbf; --warm:#c46a12; --up:#d32f2f; --down:#138a4b; --y:#b88600; --o:#d9731a;
  --ma20:#9b3fb5; --ma60:#6b7280; --chip:#eef0f4; --sel:#151a23; --selfg:#fff;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --card:#171b23; --fg:#e8ebf0; --muted:#97a0ae; --line:#272d38; --grid:#232833;
  --accent:#6aa1ff; --warm:#f0a04b; --up:#ff5b5b; --down:#35c27a; --y:#f0c84b; --o:#ff9a4b; --ma20:#c77ddb; --ma60:#8b93a1; --chip:#222835; --sel:#e8ebf0; --selfg:#151a23; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
a{color:var(--accent);text-decoration:none}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.up{color:var(--up)}.dn{color:var(--down)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hd{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 8px 4px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row+.row{margin-top:5px}
.t{flex:none;font-weight:900;font-size:15px}
.hd a.home{flex:none;font-size:12px;color:var(--muted);margin-left:auto}
.tab{flex:none;height:30px;line-height:30px;padding:0 11px;border-radius:15px;background:var(--chip);font-size:13px;font-weight:500;white-space:nowrap}
.tab b{font-family:var(--f-num);font-weight:600;margin-left:3px;opacity:.75}
.tab[aria-pressed=true]{background:var(--sel);color:var(--selfg);font-weight:700}
.tab[aria-pressed=true] b{opacity:1}
.sb{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);padding:4px 8px 0;overflow-x:auto;scrollbar-width:none}
.sb::-webkit-scrollbar{display:none}
.sb .lab{flex:none;font-weight:700;color:var(--fg)}
.sb button,.sb a.sc{flex:none;height:24px;line-height:24px;padding:0 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:12px;color:var(--fg);white-space:nowrap}
.sb button[aria-pressed=true]{background:var(--sel);color:var(--selfg);border-color:var(--sel);font-weight:700}
.sb a.sc{color:var(--accent);border-color:var(--accent);font-weight:700;margin-left:auto}
.sb .sep{flex:none;width:1px;height:16px;background:var(--line);margin:0 2px}
.cnt{padding:4px 10px 0;font-size:11.5px;color:var(--muted)}
.cnt b{color:var(--fg)}
.list{display:grid;grid-template-columns:1fr;gap:5px;padding:6px 6px 14px}
@media (min-width:700px){.list{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.list{grid-template-columns:repeat(3,1fr)}}
.nc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px 5px;display:grid;grid-template-columns:1fr 112px;grid-template-rows:auto auto;gap:2px 8px;min-width:0;position:relative}
.nc.dis{border-color:var(--up)}
.nc.warn{border-color:var(--o)}
.nc-h{display:flex;align-items:baseline;gap:5px;min-width:0;line-height:17px;flex-wrap:wrap}
.nc-h a.nm{font-size:14.5px;font-weight:900;color:inherit;white-space:nowrap}
.nc-h .cd{font-family:var(--f-num);font-size:11.5px;color:var(--muted)}
.nc-h .mk{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px;line-height:14px}
.nc-h .px{font-family:var(--f-num);font-weight:600;font-size:13px;margin-left:auto}
.nc-h .ch{font-family:var(--f-num);font-size:12px;font-weight:600}
.tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:11px;grid-column:1}
.tg{border-radius:4px;padding:0 5px;line-height:17px;background:var(--chip);color:var(--fg);white-space:nowrap}
.tg.y{background:color-mix(in srgb,var(--y) 18%,transparent);color:var(--y);font-weight:700}
.tg.o{background:color-mix(in srgb,var(--o) 18%,transparent);color:var(--o);font-weight:700}
.tg.r{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up);font-weight:700}
.tg.g{color:var(--muted)}
.tg b{font-family:var(--f-num);font-weight:600}
.rs{grid-column:1 / -1;font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.nc.open .rs{display:block;-webkit-line-clamp:unset;color:var(--fg)}
.rs i{font-style:normal;color:var(--accent);font-size:11px;margin-left:4px}
.nc.open .rs i{display:none}
.rs em{font-style:normal;color:var(--up);font-weight:700;font-family:var(--f-num)}
.kv{grid-column:2;grid-row:1 / span 2;width:112px;height:56px;display:block;align-self:start;justify-self:end}
.kv.none{display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--muted);border:1px dashed var(--line);border-radius:5px}
.foot{padding:4px 12px 20px;font-size:11px;color:var(--muted);line-height:1.5}
.empty{padding:40px 12px;text-align:center;color:var(--muted);font-size:13px}
.note{margin:6px 8px 0;padding:6px 9px;border-radius:7px;background:var(--card);border:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.5}
.note b{color:var(--fg)}
.note.hid{display:none}
</style>
</head>
<body>
<div class="hd">
  <div class="row">
    <span class="t">📢 注意／處置</span>
    <button class="tab" data-tab="att" aria-pressed="true">🟡 注意<b id="nAtt">—</b></button>
    <button class="tab" data-tab="dis" aria-pressed="false">🔴 處置<b id="nDis">—</b></button>
    <button class="tab" data-tab="pre" aria-pressed="false">🟠 快達處置<b id="nPre">—</b></button>
    <a class="home" href="index.html">← 估值看板</a>
  </div>
</div>
<div class="sb" id="bar">
  <span class="lab">市場</span><button data-m="" aria-pressed="true">全部</button><button data-m="上市">上市</button><button data-m="上櫃">上櫃</button>
  <span class="sep"></span>
  <span class="lab">排序</span><button data-s="streak" aria-pressed="true">連續天</button><button data-s="chg">漲幅</button><button data-s="vr">量比</button><button data-s="n30">30日次數</button>
  <a class="sc" id="scanLink" href="scan.html#n/att">📈 掃 K 線</a>
</div>
<div class="cnt" id="cnt"></div>
<div class="note" id="note"></div>
<div class="list" id="list"><div class="empty">讀取中…</div></div>
<p class="foot" id="foot"></p>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const pxFmt=p=>p==null?'—':p>=1000?fmt(p,0):p>=100?fmt(p,1):fmt(p,2);
const pct=(x,d=1)=>x==null?'—':(x>0?'▲':x<0?'▼':'')+Math.abs(x*100).toFixed(d)+'%';
const cls=x=>x>0?'up':x<0?'dn':'';
const md=d=>d?+d.slice(4,6)+'/'+ +d.slice(6,8):'';
let D=null,TAB='att',MK='',SORT='streak',SHARD={},K={};
const T={att:{title:'注意股',tip:'<b>注意股</b>＝交易所依「最近六日漲幅、週轉率、本益比、成交量放大」等標準公布的過熱警示。<b>不是買進訊號</b>——被列注意後常見高開低走；若手上有，把它當減碼提醒。連續天數＝連續幾個交易日都在名單上（本站自 2026/10/29 起記錄）。'},
  dis:{title:'處置股',tip:'<b>處置股</b>＝注意次數達標後改為「分盤撮合」（每 5 或 20 分鐘撮合一次）、可能要求預收款券，流動性大降、不能當沖。處置期間通常 10 個交易日。'},
  pre:{title:'快達處置',tip:'<b>快達處置</b>＝注意累計次數接近處置門檻（近 10 日 5 次或近 30 日 11 次）。再被列一次就可能進處置、分盤交易。上市名單來自證交所官方公布；上櫃若官方端點抓不到，用本站歷史次數估算（卡片會標「估算」）。'}};
async function init(){
  const r=await fetch('data/notice.json?t='+Math.floor(Date.now()/3e5)).catch(()=>null);
  D=r&&r.ok?await r.json():null;
  if(!D){$('list').innerHTML='<div class="empty">還沒有名單資料（排程第一次跑完後才有）</div>';return}
  $('nAtt').textContent=D.att.length;$('nDis').textContent=D.dis.length;$('nPre').textContent=D.pre.length;
  const h=location.hash.slice(1);if(['att','dis','pre'].includes(h))TAB=h;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;history.replaceState(null,'','#'+TAB);paint()});
  $('bar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.m!=null)MK=b.dataset.m;else if(b.dataset.s)SORT=b.dataset.s;paint()});
  $('list').addEventListener('click',e=>{if(e.target.closest('a'))return;const c=e.target.closest('.nc');if(c)c.classList.toggle('open')});
  const codes=[...new Set([...D.att,...D.dis,...D.pre].map(x=>x.c))];
  await Promise.all([...new Set(codes.map(c=>c.slice(0,2)))].map(g=>loadShard(g)));
  codes.forEach(c=>K[c]=kinfo(c));
  paint();
}
async function loadShard(g){if(SHARD[g]!==undefined)return SHARD[g];SHARD[g]=null;try{const r=await fetch('data/chip_s/'+g+'.json?t='+Math.floor(Date.now()/600000));if(r.ok)SHARD[g]=await r.json()}catch(e){}return SHARD[g]}
// 列＝[收盤,成交張,外資,投信,自營,資增減,券增減,資餘額,開,高,低,MA240]
function kinfo(c){const s=SHARD[c.slice(0,2)];if(!s||!s.d||!s.d[c])return null;const days=s.days,rows=s.d[c],bars=[];
  rows.forEach((r,i)=>{if(!r||r[0]==null)return;const cl=r[0],o=r[8]??cl,h=r[9]??Math.max(o,cl),l=r[10]??Math.min(o,cl);bars.push({d:days[i],o,h,l,c:cl,v:r[1]||0,f:r[2],t:r[3]})});
  if(bars.length<6)return null;const n=bars.length,last=bars[n-1],prev=bars[n-2];
  const ma=(w,i)=>i-w+1<0?null:bars.slice(i-w+1,i+1).reduce((a,x)=>a+x.c,0)/w;
  const v5=bars.slice(-6,-1).reduce((a,x)=>a+x.v,0)/5;
  const c6=bars[n-7]?last.c/bars[n-7].c-1:null;
  const hi20=Math.max(...bars.slice(-21,-1).map(x=>x.h));
  const sum=(k,w)=>{let a=0,g=false;bars.slice(-w).forEach(x=>{if(x[k]!=null){a+=x[k];g=true}});return g?a:null};
  return {bars,px:last.c,d:last.d,chg:prev.c?last.c/prev.c-1:null,vr:v5?last.v/v5:null,c6,hi20,ma20:ma(20,n-1),ma60:ma(60,n-1),t5:sum('t',5),f5:sum('f',5)}}
function rows(){let R=(D[TAB]||[]).filter(x=>!MK||x.m===MK);
  const k=c=>K[c]||{};
  const key={streak:x=>(x.streak||0)*1000+(x.n10||0),chg:x=>k(x.c).chg??-9,vr:x=>k(x.c).vr??-9,n30:x=>(x.n30||0)*100+(x.n10||0)}[SORT];
  return R.sort((a,b)=>key(b)-key(a)||(k(b.c).chg??0)-(k(a.c).chg??0))}
function hl(s){return esc(s).replace(/(\d+(?:\.\d+)?%|\d+(?:\.\d+)?倍)/g,'<em>$1</em>').replace(/([一二三四五六七八九十]+、)/g,'<br>$1').replace(/^<br>/,'')}
function paint(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===TAB)));
  document.querySelectorAll('#bar button').forEach(b=>{if(b.dataset.m!=null)b.setAttribute('aria-pressed',String(b.dataset.m===MK));else if(b.dataset.s)b.setAttribute('aria-pressed',String(b.dataset.s===SORT))});
  $('scanLink').href='scan.html#n/'+TAB;document.title=T[TAB].title;
  $('note').innerHTML=T[TAB].tip;
  const R=rows(),all=(D[TAB]||[]).length;
  const up=R.filter(x=>(K[x.c]||{}).chg>0).length;
  $('cnt').innerHTML=`<b>${R.length}</b>／${all} 檔・名單 ${md(D.asof)}・今日上漲 <b>${up}</b> 檔・點卡片展開原因`;
  if(!R.length){$('list').innerHTML=`<div class="empty">${all?'這個市場沒有':'今天沒有'}${T[TAB].title}</div>`;return}
  $('list').innerHTML=R.map((x,i)=>{const k=K[x.c];const cs=TAB==='dis'?'dis':(x.warn||TAB==='pre')?'warn':'';
    const tags=[];
    if(TAB==='att'){tags.push(`<span class="tg y">連 <b>${x.streak||1}</b> 天</span>`);tags.push(`<span class="tg${x.warn?' o':''}">10日 <b>${x.n10??'—'}</b>・30日 <b>${x.n30??'—'}</b> 次</span>`);if(x.warn)tags.push('<span class="tg o">⚠ 快達處置</span>');if(x.cnt)tags.push(`<span class="tg g">官方累計 <b>${fmt(x.cnt)}</b></span>`)}
    if(TAB==='dis'){tags.push(`<span class="tg r">${esc(x.period||'處置中')}</span>`);if(x.measure)tags.push(`<span class="tg g">${esc(x.measure.slice(0,28))}</span>`)}
    if(TAB==='pre'){tags.push(`<span class="tg o">10日 <b>${x.n10??'—'}</b>・30日 <b>${x.n30??'—'}</b> 次</span>`);if(x.est)tags.push('<span class="tg g">估算</span>')}
    if(x.pe!=null)tags.push(`<span class="tg g">本益比 <b>${fmt(x.pe,1)}</b></span>`);
    if(k){if(k.c6!=null)tags.push(`<span class="tg g">6日 <b class="${cls(k.c6)}">${pct(k.c6)}</b></span>`);if(k.vr!=null)tags.push(`<span class="tg g">量 <b class="${k.vr>=1.5?'up':''}">${k.vr.toFixed(1)}×</b></span>`);
      if(k.t5!=null)tags.push(`<span class="tg g">投5日 <b class="${cls(k.t5)}">${(k.t5>0?'+':'')+fmt(k.t5)}</b></span>`);if(k.f5!=null)tags.push(`<span class="tg g">外5日 <b class="${cls(k.f5)}">${(k.f5>0?'+':'')+fmt(k.f5)}</b></span>`)}
    const px=k?k.px:x.px;
    return `<article class="nc ${cs}" data-c="${esc(x.c)}" data-i="${i}">
      <div class="nc-h"><a class="nm" href="index.html#${esc(x.c)}">${esc(x.n)}</a><span class="cd">${esc(x.c)}</span><span class="mk">${esc(x.m)}</span><span class="px ${k?cls(k.chg):''}">${pxFmt(px)}</span>${k?`<span class="ch ${cls(k.chg)}">${pct(k.chg)}</span>`:''}</div>
      <div class="tags">${tags.join('')}</div>
      ${k?'<canvas class="kv"></canvas>':'<div class="kv none">無日K</div>'}
      <div class="rs">${hl(x.r||'（未附原因）')}<i>展開</i></div>
    </article>`}).join('');
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(!e.isIntersecting)return;const el=e.target,cv=el.querySelector('canvas.kv');if(cv&&!cv.dataset.done){drawMini(cv,K[el.dataset.c]);cv.dataset.done=1}io.unobserve(el)})},{rootMargin:'300px 0px'});
  $('list').querySelectorAll('.nc').forEach(el=>io.observe(el));
  $('foot').innerHTML=`小圖＝近 40 根日K（<span class="num" style="color:var(--ma20)">━</span> 20日線、<span class="num" style="color:var(--ma60)">━</span> 60日線、紅虛線＝前 20 日最高），底下一條＝投信每日買賣超（紅買綠賣）。6日＝近六個交易日漲幅（注意股主要標準之一）；量比＝今日量 ÷ 前 5 日均量；投／外 5 日＝投信／外資 5 日合計買賣超（張）。名單每個交易日 17:25 後自動更新（資料 ${esc(D.updated||'')}，本站歷史 ${D.histDays} 天）。點股名進個股頁看財報；「掃 K 線」把整份名單放進掃描頁放大看。本頁不構成投資建議。`;
}
function drawMini(cv,r){if(!r)return;const dpr=window.devicePixelRatio||1,W=cv.clientWidth,Hh=cv.clientHeight;if(!W||!Hh)return;
  cv.width=Math.round(W*dpr);cv.height=Math.round(Hh*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,Hh);
  const up=css('--up'),dn=css('--down'),fg=css('--fg'),ln=css('--grid'),MC={20:css('--ma20'),60:css('--ma60')};
  const all=r.bars,n=all.length,s=Math.max(0,n-40),vis=all.slice(s),m=vis.length;
  const instH=8,gap=2,top=2,priceH=Hh-top-instH-gap;
  const ma=(w,i)=>i-w+1<0?null:all.slice(i-w+1,i+1).reduce((a,x)=>a+x.c,0)/w;
  const lines={};[20,60].forEach(w=>lines[w]=vis.map((x,j)=>ma(w,s+j)));
  let lo=Math.min(...vis.map(x=>x.l)),hi=Math.max(...vis.map(x=>x.h));
  Object.values(lines).forEach(L=>L.forEach(v=>{if(v!=null){lo=Math.min(lo,v);hi=Math.max(hi,v)}}));
  if(r.hi20){hi=Math.max(hi,r.hi20);lo=Math.min(lo,r.hi20)}
  if(!(hi>lo)){hi=lo*1.01||1;lo=lo*0.99||0}const pad=(hi-lo)*0.05;hi+=pad;lo-=pad;
  const cw=W/m,bw=Math.max(1.2,cw*0.62),X=j=>cw*j+cw/2,Y=p=>top+(hi-p)/(hi-lo)*priceH;
  g.strokeStyle=ln;g.lineWidth=1;[0.25,0.5,0.75].forEach(f=>{const y=Y(lo+(hi-lo)*(1-f));g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()});
  if(r.hi20){const y=Y(r.hi20);g.save();g.strokeStyle=up;g.setLineDash([3,3]);g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();g.restore()}
  vis.forEach((x,j)=>{const col=x.c>x.o?up:x.c<x.o?dn:fg,xx=X(j),yo=Y(x.o),yc=Y(x.c),t=Math.min(yo,yc),hh=Math.max(1,Math.abs(yo-yc));g.strokeStyle=col;g.fillStyle=col;g.lineWidth=1;g.beginPath();g.moveTo(xx,Y(x.h));g.lineTo(xx,Y(x.l));g.stroke();g.fillRect(xx-bw/2,t,bw,hh)});
  [20,60].forEach(w=>{g.strokeStyle=MC[w];g.lineWidth=w===60?1.5:1.15;g.beginPath();let st=false;lines[w].forEach((v,j)=>{if(v==null){st=false;return}st?g.lineTo(X(j),Y(v)):g.moveTo(X(j),Y(v));st=true});g.stroke()});
  const iTop=top+priceH+gap,iMid=iTop+instH/2;let imax=1;vis.forEach(x=>{if(x.t!=null)imax=Math.max(imax,Math.abs(x.t))});
  g.strokeStyle=ln;g.beginPath();g.moveTo(0,iMid);g.lineTo(W,iMid);g.stroke();
  vis.forEach((x,j)=>{const v=x.t;if(v==null||v===0)return;const y=iMid-v/imax*(instH/2-0.5);g.fillStyle=v>0?up:dn;g.fillRect(X(j)-bw/2,Math.min(y,iMid),bw,Math.max(1,Math.abs(iMid-y)))});
}
